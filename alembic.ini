# Alembic configuration. The database URL is NOT set here: migrations/env.py
# reads DATABASE_URL (same as the app), so there is one source of truth.
#
#   alembic upgrade head                          apply all migrations
#   alembic revision --autogenerate -m "message"  draft a migration from model changes
#   alembic downgrade -1                          undo the last migration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
