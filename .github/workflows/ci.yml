name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (unit, API, web pages and migrations against Postgres)
        run: pytest -q 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Report test failures as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR)|^E " pytest.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Committed model is reproducible from the training code
        run: python -m ml.train --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stack builds and starts
        run: docker compose up -d --build
      - name: API is healthy
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker compose logs api; exit 1
      - name: Web app loads the demo and serves its pages
        run: |
          curl -fsS -X POST -o /dev/null localhost:8000/demo/reset
          for page in / /test /results /how; do curl -fsS -o /dev/null "localhost:8000$page" || exit 1; done
          curl -fsS localhost:8000/ | grep -q "Incident #"
      - name: Simulator runs end to end
        run: python3 scripts/simulate.py --customers 20 --days 10 --seed 7
      - if: always()
        run: docker compose logs api | tail -50
